  /autos/orders/{orderId}/cancel:
    post:
      tags:
      - Autos - Reservas y Check-in v2
      summary: Cancelar una orden de renta existente (Compensación Saga LIFO con Reembolso 100%)
      description: 'Ejecuta la compensación distribuida para la renta de autos.

        Libera el vehículo a estado ''DISPONIBLE'', emite código de compensación ''REF-AUTO-...'' y procesa el reembolso del
        100% sin penalización conforme al Patrón Saga.

        Emite el evento CloudEvent ''auto.order.cancelled''.

        '
      parameters:
      - *id006
      - name: orderId
        in: path
        required: true
        schema:
          type: string
        example: CAR7849B
      - *id003
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: Cambio de itinerario de vuelo
                motivo:
                  type: string
                  example: Cambio de itinerario de vuelo
                solicitante:
                  type: string
                  enum:
                  - CLIENTE
                  - SAGA_ORCHESTRATOR
                  - ADMIN
                  example: SAGA_ORCHESTRATOR
                  description: Identifica si la cancelación es un rollback compensatorio de la Saga o un autoservicio del
                    cliente.
      responses:
        '200':
          description: Orden cancelada exitosamente, vehículo liberado a DISPONIBLE y reembolso procesado
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_id:
                    type: string
                    example: CAR7849B
                  pnr:
                    type: string
                    example: CAR7849B
                  status:
                    type: string
                    example: CANCELLED
                  auto_id:
                    type: string
                    example: auto-spark-01
                  refund:
                    type: object
                    properties:
                      refund_id:
                        type: string
                        example: REF-AUTO-9921
                      amount:
                        type: number
                        example: 106.5
                      currency:
                        type: string
                        example: USD
                      percentage:
                        type: integer
                        example: 100
                      status:
                        type: string
                        example: PROCESSED
                  inventory_restoration:
                    type: object
                    properties:
                      status:
                        type: string
                        example: RESTORED
                      vehicle_id:
                        type: string
                        example: auto-spark-01
                      new_state:
                        type: string
                        example: DISPONIBLE
                  message:
                    type: string
                    example: Orden de renta cancelada exitosamente. Vehículo liberado y reembolso procesado.
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '401': *id001
        '403': *id002
        '500': *id004
        '409': *id009
  /autos/{id}/devolucion:
    post:
      tags:
      - Autos - Mantenimiento y Auditoría v2
      summary: Registrar devolución directa del vehículo e iniciar Cooldown de Limpieza de 2 Horas
      description: 'Cambia el estado operativo a ''EN_LIMPIEZA'' y fija el timestamp ''disponible_desde = NOW() + 2 HORAS''.

        Durante este lapso de 120 minutos, el auto es invisible para los motores de búsqueda y la API REST pública.

        '
      parameters:
      - *id006
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: auto-spark-01
      - *id003
      responses:
        '200':
          description: Devolución procesada y cooldown de 2 horas iniciado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevolucionAutoResponseV2'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '401': *id001
        '403': *id002
        '500': *id004
        '400': *id007
        '409': *id008
  /autos/{id}/mantenimiento/registro:
    post:
      tags:
      - Autos - Mantenimiento y Auditoría v2
      summary: Registro de odómetro, revisión física y alerta preventiva (Rol Técnico MANTENIMIENTO / ADMIN)
      description: 'Endpoint protegido exclusivamente para los roles ''MANTENIMIENTO'' o ''ADMIN'' (RBAC Cátedra RDA2 §5).

        Registra odómetro actual, combustible, estado de neumáticos y condiciones de carrocería.

        Evalúa si ''kilometraje_actual >= proximo_mantenimiento_km'' para activar alertas operativas en el dashboard y emitir
        el evento CloudEvent ''auto.mantenimiento.alerta''.

        '
      parameters:
      - *id006
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: auto-spark-01
      - *id003
      - $ref: '#/components/parameters/XRoleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroMantenimientoRequestV2'
      responses:
        '200':
          description: Registro de mantenimiento asentado exitosamente y odómetro actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroMantenimientoResponseV2'
        '401': *id001
        '403': *id002
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500': *id004
components:
  schemas:
    EstadoVehiculoEnum:
      type: string
      description: Las 6 fases formales de la máquina de estados vehicular exigidas por Cátedra RDA2 §5
      enum:
      - DISPONIBLE
      - RESERVADO
      - LISTO_PARA_ENTREGAR
      - ENTREGADO
      - EN_LIMPIEZA
      - EN_MANTENIMIENTO
      example: DISPONIBLE
    SearchAutosRequestV2:
      type: object
      required:
      - pickup_location
      - pickup_date
      - pickup_time
      - dropoff_date
      - dropoff_time
      properties:
        pickup_location:
          type: string
          description: Punto de recogida (Ciudad o código IATA como UIO, GYE)
          example: Aeropuerto Mariscal Sucre (UIO), Quito
        dropoff_location:
          type: string
          description: Punto de devolución (Mismo punto o trayecto único)
          example: Aeropuerto Mariscal Sucre (UIO), Quito
        pickup_date:
          type: string
          format: date
          example: '2026-10-20'
        pickup_time:
          type: string
          description: Franja horaria estricta en intervalos de 30 minutos
          example: '10:00'
        dropoff_date:
          type: string
          format: date
          example: '2026-10-23'
        dropoff_time:
          type: string
          description: Franja horaria estricta en intervalos de 30 minutos
          example: '10:00'
        driver_age:
          type: integer
          description: Edad del conductor principal (menores de 25 o mayores de 70 aplican recargo; menores de 18 son rechazados
            con HTTP 422)
          example: 32
        driver_age_bracket:
          type: boolean
          description: True si el conductor tiene entre 30 y 65 años (estándar sin recargo)
          default: true
        category:
          type: string
          enum:
          - ALL
          - ECONOMICO
          - COMPACTO
          - SUV
          - PREMIUM
          - VAN
          default: ALL
        transmission:
          type: string
