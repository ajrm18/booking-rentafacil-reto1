      description: 'Operación presencial efectuada al recibir el vehículo en patio.

        Registra el odómetro final (`km_retorno`), calcula los kilómetros recorridos totales, actualiza el nivel de combustible
        y transiciona inmediatamente el vehículo al estado ''EN_LIMPIEZA'' con un cooldown estricto de 2 horas (120 minutos).

        Si el odómetro supera el umbral programado, activa la alerta de mantenimiento preventivo.

        '
