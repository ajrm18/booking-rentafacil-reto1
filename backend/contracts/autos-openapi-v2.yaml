openapi: 3.0.3
info:
  title: API de Renta de Autos y Gestión de Flota (Booking Prototipo RDA2)
  version: 2.0.0
  description: "# Contrato Oficial de Integración — Vertical de Renta de Autos (RDA2)\n\n> **Sistema Emisor / Proveedor:**\
    \ Tiendas y Concesionarias de Renta de Autos (Páginas Individuales de Compañeros RDA2)  \n> **Sistema Consumidor / Agregador\
    \ Central:** Booking Prototipo (Marketplace Multimodal — Paúl Rosero)  \n> **Asignatura:** Integración de Sistemas — 6to\
    \ Semestre (Reto 2: RDA2)  \n> **Estándar:** OpenAPI Specification 3.0.3 (API-First, REST HATEOAS Nivel 3, RFC 7807 Problem\
    \ Details, CloudEvents v1.0)  \n> **Documento Oficial:** `contracts/autos-openapi-v2.yaml`  \n> **Fecha de Emisión Oficial:**\
    \ Octubre 2026  \n\n---\n\n## 1. Propósito y Alcance del Contrato v2.0.0\nEste contrato formaliza la interfaz canónica\
    \ de comunicación para la **integración bidireccional** entre las tiendas individuales de Renta de Autos construidas por\
    \ los compañeros y el agregador central **Booking Prototipo**. Provee las especificaciones técnicas rigurosas y blindadas\
    \ para que cualquier microservicio o frontend de autos funcione de manera interoperable sin fallas de integración (Condición\
    \ Habilitante Obligatoria y Criterio Excluyente CE01 de la Cátedra RDA2).\n\n### Pilares de Negocio y Arquitectura Implementados:\n\
    1. **Búsqueda Avanzada y Control Etario (HU-AUT-01):**\n   - Franjas horarias estrictas de 30 minutos, autocompletado\
    \ de aeropuertos IATA y ciudades.\n   - Filtros por categorías (`ECONOMICO`, `COMPACTO`, `SUV`, `PREMIUM`, `VAN`) y transmisión\
    \ (`MANUAL` vs `AUTOMATICO`).\n   - Control de edad del conductor: recargo obligatorio para jóvenes (<25 años) o seniors\
    \ (>70 años); rechazo legal a menores de 18 años con HTTP 422.\n2. **Ficha Técnica y Coberturas Diferenciadas (HU-AUT-03):**\n\
    \   - Desglose transparente entre Protección Básica (con franquicia / depósito retenido) vs Cobertura Total / Premium\
    \ (sin franquicia, depósito $0.00).\n   - Política de combustible \"Lleno a Lleno\" (Full-to-Full) y kilometraje ilimitado\
    \ garantizado.\n3. **Máquina de Estados Finita de 6 Fases (Consideraciones RDA2 §5):**\n   - Estados oficiales: `DISPONIBLE`\
    \ ➔ `RESERVADO` ➔ `LISTO_PARA_ENTREGAR` ➔ `ENTREGADO` ➔ `EN_LIMPIEZA` ➔ `EN_MANTENIMIENTO`.\n   - **Cooldown Obligatorio\
    \ de 2 Horas (120 min):** Tras la devolución del auto, el vehículo queda en estado `EN_LIMPIEZA`. Durante este lapso,\
    \ el auto queda 100% excluido de los resultados de búsqueda. Si se intenta reservar, la API responde HTTP 409 Conflict\
    \ (`VEHICLE_IN_CLEANING_COOLDOWN`).\n4. **Doble Check-in Operativo y Mostrador (HU-AUT-06):**\n   - **Check-in 1 (Digital\
    \ Express):** `POST /autos/reservas/{id}/checkin` genera el Voucher QR Fast-Track.\n   - **Check-in 2 (Entrega Mostrador):**\
    \ `POST /autos/orders/{id}/checkin-entrega` valida licencia física, registra odómetro inicial (`km_salida`) y transiciona\
    \ el auto a `ENTREGADO`.\n   - **Check-in 3 (Devolución Patio):** `POST /autos/orders/{id}/checkin-devolucion` registra\
    \ odómetro final (`km_retorno`), combustible, calcula kilómetros recorridos y activa inmediatamente las 2 horas de cooldown\
    \ en `EN_LIMPIEZA`.\n5. **Rol Técnico y Mantenimiento Preventivo (Consideraciones RDA2 §5):**\n   - Endpoint protegido\
    \ con RBAC (`MANTENIMIENTO` o `ADMIN`): `POST /autos/{id}/mantenimiento/registro`.\n   - Algoritmo de alerta preventiva\
    \ auditable cuando `kilometraje_actual >= proximo_mantenimiento_km`.\n6. **Mandato B2B de Promociones y Combos (Consideraciones\
    \ RDA2 §9):**\n   - Cuestionario obligatorio de la cátedra resuelto en `GET /autos/promociones/contrato` y `PUT /autos/promociones/contrato`\
    \ (`permite_promociones`, `porcentaje_descuento_maximo`).\n7. **Transaccionalidad Distribuida, Sagas y Resiliencia (CE01\
    \ / CE03 / CE08):**\n   - Cancelación compensatoria LIFO con reembolso del 100% (`POST /autos/orders/{orderId}/cancel`)\
    \ y retorno inmediato a `DISPONIBLE`.\n   - Cabeceras obligatorias `Idempotency-Key` (UUID v4) y `X-Correlation-Id`.\n\
    \   - Tolerancia perimetral de 5 segundos con Circuit Breaker y Mock Fallback automático.\n8. **Observabilidad EDA y Telemetría\
    \ de Nodo (Consideraciones RDA2 §2):**\n   - Endpoint de salud `GET /autos/health` para alimentar el Semáforo LED (\U0001F7E2\
    \ Verde / \U0001F534 Rojo) del Panel 1 de Administración.\n   - Feed de eventos Outbox `GET /autos/eventos` y especificación\
    \ CloudEvents v1.0 hacia RabbitMQ y Apache Kafka.\n\n---\n\n## 2. Arquitectura de Comunicación Híbrida: REST vs. gRPC\
    \ (Consideraciones RDA2)\nConforme a lo exigido en la Semana 8 y Consideraciones RDA2:\n* **Compras y Transacciones (ÚNICAMENTE\
    \ REST):** La exploración de catálogo, checkout con idempotencia, check-in, cancelación y mantenimiento se ejecutan EXCLUSIVAMENTE\
    \ mediante peticiones HTTP RESTful bajo este contrato OpenAPI v2.\n* **Sincronización de Stock e Inventario (OBLIGATORIAMENTE\
    \ gRPC sobre HTTP/2 — Puerto 50051):** Las tiendas individuales DEBEN transmitir sus cambios de stock de flota hacia Booking\
    \ Prototipo a través del canal gRPC, permitiendo ingesta en memoria RAM a alta velocidad.\n\n### 2.1. Especificación Oficial\
    \ de Envío de Stock por gRPC\n1. **Endpoint Inbound de Ingesta:** `grpc://booking.epn.edu.ec:50051` (Local: `localhost:50051`).\n\
    2. **Protocolo:** HTTP/2 multiplexado binario.\n3. **Servicio Protobuf:** `inventory.InventoryStockService`.\n4. **Métodos\
    \ RPC Habilitados:**\n   - `rpc PushStockUpdate (StockUpdateMessage) returns (StockUpdateAck);` (Envío ante cada reserva\
    \ o liberación de auto).\n   - `rpc StreamInventoryChanges (stream StockChangeEvent) returns (StreamSummary);` (Streaming\
    \ masivo de flota).\n5. **Contrato Protobuf Oficial (`src/proto/inventory.proto`):**\n   ```protobuf\n   syntax = \"proto3\"\
    ;\n   package inventory;\n\n   service InventoryStockService {\n     rpc PushStockUpdate (StockUpdateMessage) returns\
    \ (StockUpdateAck);\n     rpc StreamInventoryChanges (stream StockChangeEvent) returns (StreamSummary);\n   }\n\n   message\
    \ StockUpdateMessage {\n     string service_id = 1;      // \"autos\" o código del nodo (ej. \"NODE_AUT_LOCAL\")\n   \
    \  string item_id = 2;         // ID del vehículo (ej. \"auto-spark-01\")\n     string date = 3;            // Fecha en\
    \ formato YYYY-MM-DD (ej. \"2026-10-25\")\n     string time_slot = 4;       // Franja horaria (ej. \"10:00\")\n     int32\
    \ available_units = 5;  // 1 si DISPONIBLE, 0 si RESERVADO/EN_LIMPIEZA\n     int64 timestamp = 6;        // Epoch en milisegundos\n\
    \   }\n\n   message StockUpdateAck {\n     bool success = 1;\n     string message = 2;\n     int64 processed_at = 3;\n\
    \   }\n\n   message StockChangeEvent {\n     string event_id = 1;\n     string service_id = 2;\n     string item_id =\
    \ 3;\n     string date = 4;\n     string time_slot = 5;\n     int32 delta = 6;            // +1 o -1\n     int64 timestamp\
    \ = 7;\n   }\n\n   message StreamSummary {\n     int32 total_events_processed = 1;\n     bool is_synchronized = 2;\n \
    \    string last_sync_hash = 3;\n   }\n   ```\n\n---\n\n## 3. Mandato de Cátedra RDA2: Cuestionario B2B de Acuerdo de\
    \ Promociones y Combos\nConforme a lo dictado en las Consideraciones RDA2 (Página 149):\n> *\"En el contrato con los partners\
    \ se solicita una sola vez: si acepta hacer promociones y cuál es el porcentaje máximo de descuento que estaría dispuesto\
    \ a aplicar.\"*\n\nPara formalizar esta alianza comercial y permitir a Booking estructurar paquetes combinados (ej. Auto\
    \ + Hotel + Vuelo):\n* **Consulta del Acuerdo Vigente:** `GET /autos/promociones/contrato` retorna los términos vigentes.\n\
    * **Declaración / Formalización Obligatoria:** `PUT /autos/promociones/contrato` permite formalizar:\n  1. `permite_promociones`\
    \ (boolean): ¿Acepta participar en la creación de paquetes turísticos multidominio?\n  2. `porcentaje_descuento_maximo`\
    \ (number): ¿Cuál es el porcentaje máximo de descuento que autoriza aplicar (ej. 15.0%)?\n  3. `destinos_habilitados`\
    \ (array): Ciudades habilitadas para el retiro de autos en promoción (ej. `[\"Quito\", \"Guayaquil\", \"Cuenca\"]`).\n\
    \  4. `vigencia_hasta` (date): Fecha de vigencia del acuerdo.\n  5. `condiciones_combo` (string): Condiciones de aplicación.\n\
    \n---\n\n## 4. Protocolo de Errores Estandarizado (RFC 7807 Problem Details)\nTodas las respuestas de error utilizan el\
    \ formato estándar `application/problem+json`:\n```json\n{\n  \"type\": \"https://api.booking.local/errors/vehicle-unavailable\"\
    ,\n  \"title\": \"Vehículo en Cooldown de Limpieza\",\n  \"status\": 409,\n  \"detail\": \"El vehículo está actualmente\
    \ en ciclo de limpieza e higienización obligatoria (2 horas). Estará disponible a las 14:30 UTC.\",\n  \"instance\": \"\
    /api/v2/autos/auto-spark-01/orders/create\",\n  \"code\": \"VEHICLE_IN_CLEANING_COOLDOWN\",\n  \"correlation_id\": \"\
    corr-autos-987654\",\n  \"timestamp\": \"2026-10-22T11:00:00Z\"\n}\n```\n"
servers:
- url: /api/v2
  description: API Gateway Booking Prototipo — Ruta base canónica v2 (Producción / Local)
- url: https://booking.epn.edu.ec/api/v2
  description: Servidor de Producción Desplegado en Internet Público (HTTPS Let's Encrypt / Cloudflare)
- url: http://localhost:3000/api/v2
  description: Entorno de Desarrollo Local del Gateway NestJS
- url: /api/v1
  description: Ruta Legacy v1 (Compatibilidad hacia atrás)
tags:
- name: Autos - Catálogo y Búsqueda v2
  description: Búsqueda avanzada con franjas horarias de 30m, catálogo general de vehículos y especificaciones técnicas.
- name: Autos - Reservas y Check-in v2
  description: Creación de reservas con Idempotency-Key, coberturas, check-in digital express y compensación Saga.
- name: Autos - Flota y Operaciones Mostrador v2
  description: Panel de flota con cronómetro de cooldown en vivo, check-in de entrega y check-in de devolución.
- name: Autos - Mantenimiento y Auditoría v2
  description: Endpoints técnicos protegidos para registro de odómetro, revisión física y alertas preventivas.
- name: Autos - Promociones B2B y Combos v2
  description: Consulta y formalización de acuerdos comerciales para paquetes turísticos conforme a Cátedra RDA2 §9.
- name: Autos - Telemetría y Salud de Nodo v2
  description: Endpoints de monitoreo de salud para el Semáforo LED (🟢/🔴) del Panel 1 de Administración y feed Outbox EDA.
paths:
  /autos/health:
    get:
      tags:
      - Autos - Telemetría y Salud de Nodo v2
      summary: Healthcheck y telemetría de nodo del microservicio de Autos (Semáforo 🟢/🔴 RDA2 CE01)
      description: 'Endpoint consumido por el Monitor de Nodos del Booking Prototipo (Panel 1).

        Reporta el estado operativo (''HEALTHY'', ''DOWN'', ''DEGRADED''), latencia, uptime y métricas de vehículos en cooldown
        para alimentar el semáforo LED visual de auditoría.

        '
      responses:
        '200':
          description: Nodo de autos operativo y saludable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutosHealthResponseV2'
        '503':
          $ref: '#/components/responses/ProblemDetails503'
      parameters: []
      security: []
  /autos/promociones/contrato:
    get:
      tags:
      - Autos - Promociones B2B y Combos v2
      summary: Consultar acuerdo comercial B2B para combos y promociones (Cátedra RDA2 §9)
      description: 'Retorna el estado del acuerdo comercial pactado entre la tienda de autos y Booking Prototipo para la creación
        de paquetes turísticos multidominio.

        Responde a la exigencia de la Cátedra RDA2 §9: verificar si el partner acepta promociones y cuál es el porcentaje
        máximo de descuento autorizado.

        '
      responses:
        '200':
          description: Términos comerciales de promociones recuperados exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratoPromocionesResponseV2'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
        '401': &id001
          $ref: '#/components/responses/ProblemDetails401'
        '403': &id002
          $ref: '#/components/responses/ProblemDetails403'
      parameters:
      - &id003
        $ref: '#/components/parameters/XCorrelationIdHeader'
    put:
      tags:
      - Autos - Promociones B2B y Combos v2
      summary: Actualizar o formalizar acuerdo B2B de promociones y combos (Cátedra RDA2 §9)
      description: 'Permite a la tienda socia (o a su agente inteligente) responder oficialmente a las preguntas de la cátedra:

        1. ¿Acepta participar en la creación de promociones y combos de paquetes turísticos? (`permite_promociones`)

        2. ¿Cuál es el porcentaje máximo de descuento que autoriza aplicar? (`porcentaje_descuento_maximo`)

        3. ¿En qué ciudades aplica el convenio? (`destinos_habilitados`)

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContratoPromocionesRequestV2'
      responses:
        '200':
          description: Acuerdo comercial formalizado y actualizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  mensaje:
                    type: string
                    example: Acuerdo B2B de promociones y combos actualizado exitosamente.
                  contrato:
                    $ref: '#/components/schemas/ContratoPromocionesResponseV2'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401': *id001
        '403': *id002
        '500': &id004
          $ref: '#/components/responses/ProblemDetails500'
      parameters:
      - &id006
        $ref: '#/components/parameters/IdempotencyKeyHeader'
      - *id003
  /autos/eventos:
    get:
      tags:
      - Autos - Telemetría y Salud de Nodo v2
      summary: Feed Outbox de eventos asíncronos para streaming EDA (RabbitMQ / Kafka)
      description: 'Mecanismo Transactional Outbox que expone los eventos emitidos por el microservicio de autos para streaming
        y sincronización con Apache Kafka y RabbitMQ.

        '
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 10
        example: 10
      - name: after
        in: query
        required: false
        schema:
          type: string
        example: evt-car-100
      - *id003
      responses:
        '200':
          description: Feed de eventos recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutosEventosResponseV2'
        '401': *id001
        '403': *id002
        '500': *id004
  /autos:
    get:
      tags:
      - Autos - Catálogo y Búsqueda v2
      summary: Listar catálogo general de vehículos disponibles
      description: 'Retorna la lista de vehículos disponibles en inventario.

        Aplica exclusión automática para vehículos en estado ''RESERVADO'', ''ENTREGADO'', ''EN_MANTENIMIENTO'' o en cooldown
        de 2 horas (''EN_LIMPIEZA'').

        '
      parameters:
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum:
          - ALL
          - ECONOMICO
          - COMPACTO
          - SUV
          - PREMIUM
          - VAN
          default: ALL
      - name: transmission
        in: query
        required: false
        schema:
          type: string
          enum:
          - ALL
          - MANUAL
          - AUTOMATICO
          default: ALL
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 10
      responses:
        '200':
          description: Catálogo de vehículos disponibles recuperado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 4
                  limit:
                    type: integer
                    example: 10
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AutoVehiculoCardV2'
        '500': *id004
      security: []
  /autos/search:
    post:
      tags:
      - Autos - Catálogo y Búsqueda v2
      summary: Búsqueda avanzada de vehículos (Catálogo Híbrido v2 con Cooldown de 2h)
      description: 'Consulta vehículos disponibles en el punto de recogida seleccionado con franjas horarias de 30 minutos.

        Aplica filtro de exclusión automática para vehículos en estado ''RESERVADO'', ''ENTREGADO'', ''EN_MANTENIMIENTO''
        o en ciclo de limpieza (''EN_LIMPIEZA'' dentro del cooldown obligatorio de 2 horas).

        Evalúa edad del conductor para aplicar recargo joven (<25 años) o senior (>70 años), o rechazar con HTTP 422 si es
        menor de 18 años.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchAutosRequestV2'
      responses:
        '200':
          description: Lista de vehículos disponibles recuperada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAutosResponseV2'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '422':
          $ref: '#/components/responses/ProblemDetails422'
        '503':
          $ref: '#/components/responses/ProblemDetails503'
      parameters:
      - &id005
        $ref: '#/components/parameters/XCorrelationIdHeader'
      security: []
  /autos/flota:
    get:
      tags:
      - Autos - Flota y Operaciones Mostrador v2
      summary: Consultar estado operativo de toda la flota con cronómetro de cooldown en vivo (Panel 2)
      description: 'Endpoint consumido por el Panel 2 de Gestión de Flota de Autos.

        Reporta en tiempo real los 6 estados operativos de la flota, el conteo regresivo de 2 horas de cooldown (`segundos_restantes_cooldown`),
        timestamp estimado de disponibilidad y las alertas preventivas de kilometraje.

        '
      responses:
        '200':
          description: Flota completa recuperada con telemetría de cooldown y kilometraje
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AutoFlotaItemV2'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
      parameters:
      - *id005
      security: []
  /autos/{id}/coberturas:
    get:
      tags:
      - Autos - Catálogo y Búsqueda v2
      summary: Consultar opciones de cobertura y seguros para un vehículo (Protección Básica vs Cobertura Total)
      description: 'Retorna la comparativa oficial entre:

        1. **Protección Básica (Incluida):** Franquicia de $1,200.00 y retención de depósito de garantía en tarjeta de crédito.

        2. **Cobertura Total / Premium:** Franquicia de $0.00, depósito retenido de $0.00, protección integral de cristales,
        neumáticos, bajos y pérdida de llaves con recargo diario transparente.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: auto-spark-01
      - *id005
      responses:
        '200':
          description: Opciones de cobertura desglosadas con franquicias y depósitos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoberturasResponseV2'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500': *id004
      security: []
  /autos/{id}:
    get:
      tags:
      - Autos - Catálogo y Búsqueda v2
      summary: Consultar detalle técnico de un vehículo por ID
      description: Retorna ficha técnica completa, imágenes, política de combustible ("Lleno a lleno"), kilometraje actual
        y estado operativo en la máquina de estados.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: auto-spark-01
      - *id005
      responses:
        '200':
          description: Detalle del vehículo recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoVehiculoCardV2'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500': *id004
      security: []
  /autos/orders:
    get:
      tags:
      - Autos - Reservas y Check-in v2
      summary: Listar todas las órdenes de renta de autos (Consola de Gestión)
      description: Retorna el historial agregado de reservas de vehículos para el sistema de administración central.
      responses:
        '200':
          description: Lista de órdenes de renta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AutoOrderResponseV2'
        '401': *id001
        '403': *id002
        '500': *id004
      parameters:
      - *id003
  /autos/orders/create:
    post:
      tags:
      - Autos - Reservas y Check-in v2
      summary: Crear reserva de vehículo con Idempotency-Key y Cobertura (Transacción Saga)
      description: 'Formaliza el alquiler de un vehículo. Transiciona el auto de ''DISPONIBLE'' a ''RESERVADO''.

        Requiere cabecera obligatoria ''Idempotency-Key'' para garantizar tolerancia a reintentos de red y emite el evento
        CloudEvent ''auto.order.confirmed''.

        Genera localizador PNR de 8 caracteres y código QR digital de retiro express.

        '
      parameters:
      - *id006
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAutoOrderRequestV2'
      responses:
        '201':
          description: Reserva creada y confirmada exitosamente con voucher QR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoOrderResponseV2'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '422':
          $ref: '#/components/responses/ProblemDetails422'
        '503':
          $ref: '#/components/responses/ProblemDetails503'
        '401': *id001
        '403': *id002
        '500': *id004
  /autos/reservas:
    post:
      tags:
      - Autos - Reservas y Check-in v2
      summary: Crear reserva de vehículo (Alias de compatibilidad v2)
      description: Endpoint alternativo equivalente a `/autos/orders/create` para compatibilidad de clientes.
      parameters:
      - *id006
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAutoOrderRequestV2'
      responses:
        '201':
          description: Reserva de auto creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoOrderResponseV2'
        '409': &id009
          $ref: '#/components/responses/ProblemDetails409'
        '401': *id001
        '403': *id002
        '500': *id004
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '422':
