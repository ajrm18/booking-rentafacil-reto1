  /v1/admin/orders/{orderId}/return:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags:
        - Admin - Returns
      summary: Registrar la devolucion del vehiculo de una orden
      description: |
        - **No cancela** la orden: sigue `CONFIRMED` y se guardan `returned_at = ahora` y
          `returned_by_sub = sub del JWT`.
        - El vehiculo pasa a `WASHING` con `wash_until = ahora + 2 h`.
        - `POST /search` solo lo ofrece para recogidas `>= wash_until`; al vencer el lavado vuelve
          solo a `AVAILABLE`.
        - **Idempotente**: si la orden ya tiene `returned_at`, responde 200 con el estado actual
          sin modificar nada.
        - Si el vehiculo ya esta reservado por **otra** orden activa (se devuelve una orden antigua),
          solo se registra la devolucion y el vehiculo conserva su estado (evita una doble reserva).

        Requiere los scopes `autos:webhooks` (administrador) y `autos:book`.
      operationId: returnOrder
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Orden devuelta y estado del vehiculo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnResponse'
        '400':
          $ref: '#/components/responses/ProblemDetailsV1_400'
        '401':
          $ref: '#/components/responses/ProblemDetailsV1_401'
        '403':
          $ref: '#/components/responses/ProblemDetailsV1_403'
        '404':
          description: La orden o su vehiculo no existen
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsV1'
        '409':
          description: La orden no esta CONFIRMED (code BOOKING_NOT_CONFIRMED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsV1'
