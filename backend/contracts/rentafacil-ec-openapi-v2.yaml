    ProblemDetails409:
      description: Conflicto de Idempotencia o vehículo en cooldown de limpieza de 2 horas (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails422:
      description: Error de entidad no procesable o conductor menor de 18 años (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails500:
      description: Error interno del servidor en telemetría de flota (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails503:
      description: Agencia de alquiler externa no disponible (Circuit Breaker abierto) (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetailsV1_400:
      description: Peticion invalida (invalidParams detalla los campos)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetailsV1'
    ProblemDetailsV1_401:
      description: Falta el JWT, expiro o las credenciales no son validas
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetailsV1'
    ProblemDetailsV1_403:
      description: El token no tiene el scope requerido
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetailsV1'
    ProblemDetailsV1_404:
      description: No encontrado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetailsV1'
    ProblemDetailsV1_409:
      description: Conflicto con el estado actual (ej. registro con dependencias)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetailsV1'
    ProblemDetailsV1_429:
      description: Demasiadas peticiones
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetailsV1'
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Identificador único universal (UUID v4) generado por el cliente para garantizar idempotencia en la mutación
        transaccional (IETF Draft). Evita duplicación de cobros o bloqueo indebido de vehículos ante reintentos de red.
      schema:
        type: string
        format: uuid
      example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
    XCorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: >-
        Identificador unívoco de trazabilidad distribuida cross-broker (Semana 8 & Consideraciones RDA2). Se propaga
        entre peticiones HTTP, logs físicos estructurados y eventos de RabbitMQ / Apache Kafka.
      schema:
        type: string
      example: cid-aut-9921b
    XNodeIdHeader:
      name: X-Node-Id
      in: header
      required: false
      description: Identificador del nodo emisor de la petición (ej. node-booking-core-01).
      schema:
        type: string
      example: node-booking-core-01
    XRoleHeader:
      name: X-Role
      in: header
      required: false
      description: >-
        Rol del usuario para control de acceso basado en roles (RBAC RDA2 §5). Valores admitidos: CLIENTE, ADMIN,
        MANTENIMIENTO.
      schema:
        type: string
        enum:
          - CLIENTE
          - ADMIN
          - MANTENIMIENTO
      example: MANTENIMIENTO
    OrderId:
      name: orderId
      in: path
      required: true
      description: order_id (UUID)
      schema:
        type: string
        format: uuid
    GenericResource:
      name: resource
      in: path
      required: true
      schema:
        type: string
        enum:
          - vehicle-images
          - holds
          - order-previews
          - webhooks
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Token JWT emitido conforme al estándar RFC 7519 para autenticación de usuarios y roles autorizados (CLIENTE,
        ADMIN, MANTENIMIENTO).
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        Clave de API precompartida para comunicación máquina a máquina (M2M) e interconexión segura entre Booking
        Prototipo y concesionarias de Renta de Autos.
security:
  - BearerAuth: []
  - ApiKeyAuth: []
