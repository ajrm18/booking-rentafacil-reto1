    ProblemDetails:
      type: object
      description: Estructura canónica de error conforme a la especificación RFC 7807 (Problem Details for HTTP APIs).
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          description: URI absoluta o relativa que tipifica el error según la cátedra.
          example: https://booking.epn.edu.ec/errors/cooldown-activo
        title:
          type: string
          description: Resumen corto y legible del problema.
          example: Vehículo en Cooldown de Limpieza Obligatorio (2 Horas)
        status:
          type: integer
          description: Código de estado HTTP correspondiente (400, 401, 403, 404, 409, 422, 500, 503).
          example: 409
        detail:
          type: string
          description: Explicación detallada del motivo del fallo o contingencia.
          example: >-
            El vehículo auto-spark-01 se encuentra en fase de limpieza y desinfección obligatoria de 120 minutos tras su
            retorno. Estará disponible nuevamente a las 14:30:00 UTC.
        instance:
          type: string
          description: URI de la solicitud que originó el error.
          example: /api/v2/autos/orders/create
        code:
          type: string
          description: Código nemotécnico unívoco para evaluación algorítmica en el cliente o agregador.
          example: VEHICLE_IN_CLEANING_COOLDOWN
        correlation_id:
          type: string
          description: Identificador de correlación unívoco propagado para trazabilidad en logs físicos.
          example: cid-aut-9921b
        timestamp:
          type: string
          format: date-time
          description: Marca de tiempo ISO 8601 UTC en que se generó la excepción.
          example: '2026-10-24T18:30:00Z'
        invalid_params:
          type: array
          description: Lista de parámetros o campos que no superaron la validación sintáctica o de negocio.
          items:
            type: object
            properties:
              name:
                type: string
                example: pickup_date
              reason:
                type: string
                example: La fecha de recogida no puede ser en el pasado.
