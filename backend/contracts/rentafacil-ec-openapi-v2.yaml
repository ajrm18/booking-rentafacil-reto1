# Contrato propio de RentaFacil EC para el Reto 2 (RDA2). GENERADO: no editar a mano.
# Fuente: contracts/autos-openapi-v2.yaml (oficial) + contracts/rentafacil-ec-openapi.yaml (interno).
# Regenerar: node scripts/build-contrato-propio-v2.mjs
openapi: 3.0.3
info:
  title: RentaFacil EC — Autos API v2 (contrato oficial RDA2 + extensiones propias)
  version: 2.0.0-rentafacil.1
  contact:
    name: Anthony Rosero
  description: >-
    Contrato propio de **RentaFacil EC** para el Reto 2. Extiende el contrato oficial

    `autos-openapi-v2.yaml` (v2.0.0, fuente de verdad, sin cambios en sus operaciones: rutas `/v2/...`)

    con los endpoints internos que no forman parte del contrato público (rutas `/v1/...`: Auth, Account

    y el BFF `/admin`, que siguen bajo `/api/v1`) y una extensión v2 (`/v2/autos/{id}/mantenimiento/bitacora`).


    **Server**: `/api` (cada ruta lleva su versión). Generado con `scripts/build-contrato-propio-v2.mjs`.


    ### Decisiones de implementación

    - **Roles (BearerAuth)**: el JWT de `POST /v1/auth/token` lleva `role` = `client` | `admin` | `mechanic`,
      expuestos en v2 como `CLIENTE` | `ADMIN` | `MANTENIMIENTO`. La cabecera `X-Role` es informativa: el rol sale del token.
    - **ApiKeyAuth**: `X-API-Key` se acepta para el Booking Prototipo (rol `B2B`) cuando el servidor tiene
    `BOOKING_API_KEY`.

    - **X-Correlation-Id**: opcional según el contrato; si falta se genera y siempre se devuelve en la respuesta.

    - **Idempotency-Key**: UUID v4 obligatorio en toda mutación (400 si falta). Reintentos devuelven la misma respuesta.

    - **Estados**: `vehicles.status` sigue en inglés (AVAILABLE, RESERVED, READY_FOR_PICKUP, DELIVERED, WASHING,
    MAINTENANCE)
      y se publica con las 6 fases de `EstadoVehiculoEnum`. Cooldown EN_LIMPIEZA = 120 min exactos.
    - **Precios v2**: con impuestos incluidos (como el ejemplo oficial 3 × 35.50 + 3 × 18 = 160.50); recargo por edad 10
    USD/día.

    - **Extensiones de respuesta**: `AutoOrderResponseV2` agrega `checkins` (las 3 fases con sus timestamps),
    `vehiculo`,
      `recogida`, `devolucion`; `AutosHealthResponseV2` agrega `dependencias`, `event_bus_modo` y `outbox_pendientes`.
      El contrato oficial no declara `additionalProperties: false`, así que son compatibles.
servers:
  - url: https://rentafacil-api.onrender.com/api
    description: Producción (Render)
  - url: http://localhost:3000/api
    description: Local
tags:
  - name: Autos - Catálogo y Búsqueda v2
    description: Búsqueda avanzada con franjas horarias de 30m, catálogo general de vehículos y especificaciones técnicas.
  - name: Autos - Reservas y Check-in v2
    description: Creación de reservas con Idempotency-Key, coberturas, check-in digital express y compensación Saga.
  - name: Autos - Flota y Operaciones Mostrador v2
    description: Panel de flota con cronómetro de cooldown en vivo, check-in de entrega y check-in de devolución.
  - name: Autos - Mantenimiento y Auditoría v2
    description: Endpoints técnicos protegidos para registro de odómetro, revisión física y alertas preventivas.
  - name: Autos - Promociones B2B y Combos v2
    description: Consulta y formalización de acuerdos comerciales para paquetes turísticos conforme a Cátedra RDA2 §9.
  - name: Autos - Telemetría y Salud de Nodo v2
    description: Endpoints de monitoreo de salud para el Semáforo LED (🟢/🔴) del Panel 1 de Administración y feed Outbox EDA.
  - name: RentaFacil - Extensiones v2
    description: Endpoints v2 propios de RentaFacil EC (fuera del contrato oficial)
  - name: Auth
    description: Authorization Server local (login y registro de clientes) (interno, /api/v1)
  - name: Admin - Vehicles
    description: CRUD de la tabla vehicles (incluye estado WASHING y wash_until) (interno, /api/v1)
  - name: Admin - Depots
    description: CRUD de la tabla depots (cada cambio emite el webhook DEPOT_UPDATE) (interno, /api/v1)
  - name: Admin - Suppliers
    description: CRUD de la tabla suppliers (interno, /api/v1)
  - name: Admin - Orders
    description: CRUD de la tabla orders (interno, /api/v1)
  - name: Admin - Users
    description: CRUD de la tabla users (nunca devuelve la contrasena) (interno, /api/v1)
  - name: Admin - Returns
    description: Devolucion de vehiculos; la orden sigue CONFIRMED y el vehiculo pasa a WASHING 2 h (interno, /api/v1)
  - name: Admin - Dashboard
    description: Estadisticas agregadas para el panel de control (interno, /api/v1)
  - name: Admin - Other
    description: Resto de tablas (vehicle_images, holds, order_previews, webhook_subscriptions) (interno, /api/v1)
  - name: Account
    description: Datos del usuario autenticado (dueno = sub del JWT) (interno, /api/v1)
paths:
  /v2/autos/health:
    get:
      tags:
        - Autos - Telemetría y Salud de Nodo v2
      summary: Healthcheck y telemetría de nodo del microservicio de Autos (Semáforo 🟢/🔴 RDA2 CE01)
      description: >
        Endpoint consumido por el Monitor de Nodos del Booking Prototipo (Panel 1).

        Reporta el estado operativo ('HEALTHY', 'DOWN', 'DEGRADED'), latencia, uptime y métricas de vehículos en
        cooldown para alimentar el semáforo LED visual de auditoría.
      responses:
        '200':
          description: Nodo de autos operativo y saludable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutosHealthResponseV2'
        '503':
          $ref: '#/components/responses/ProblemDetails503'
      parameters: []
      security: []
  /v2/autos/promociones/contrato:
    get:
      tags:
        - Autos - Promociones B2B y Combos v2
      summary: Consultar acuerdo comercial B2B para combos y promociones (Cátedra RDA2 §9)
      description: >
        Retorna el estado del acuerdo comercial pactado entre la tienda de autos y Booking Prototipo para la creación de
        paquetes turísticos multidominio.

        Responde a la exigencia de la Cátedra RDA2 §9: verificar si el partner acepta promociones y cuál es el
        porcentaje máximo de descuento autorizado.
      responses:
        '200':
          description: Términos comerciales de promociones recuperados exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratoPromocionesResponseV2'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
    put:
      tags:
        - Autos - Promociones B2B y Combos v2
      summary: Actualizar o formalizar acuerdo B2B de promociones y combos (Cátedra RDA2 §9)
      description: |
        Permite a la tienda socia (o a su agente inteligente) responder oficialmente a las preguntas de la cátedra:
        1. ¿Acepta participar en la creación de promociones y combos de paquetes turísticos? (`permite_promociones`)
        2. ¿Cuál es el porcentaje máximo de descuento que autoriza aplicar? (`porcentaje_descuento_maximo`)
        3. ¿En qué ciudades aplica el convenio? (`destinos_habilitados`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContratoPromocionesRequestV2'
      responses:
        '200':
          description: Acuerdo comercial formalizado y actualizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  mensaje:
                    type: string
                    example: Acuerdo B2B de promociones y combos actualizado exitosamente.
                  contrato:
                    $ref: '#/components/schemas/ContratoPromocionesResponseV2'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
  /v2/autos/eventos:
    get:
      tags:
        - Autos - Telemetría y Salud de Nodo v2
      summary: Feed Outbox de eventos asíncronos para streaming EDA (RabbitMQ / Kafka)
      description: >
        Mecanismo Transactional Outbox que expone los eventos emitidos por el microservicio de autos para streaming y
        sincronización con Apache Kafka y RabbitMQ.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
          example: 10
        - name: after
          in: query
          required: false
          schema:
            type: string
          example: evt-car-100
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '200':
          description: Feed de eventos recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutosEventosResponseV2'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /v2/autos:
    get:
      tags:
        - Autos - Catálogo y Búsqueda v2
      summary: Listar catálogo general de vehículos disponibles
      description: >
        Retorna la lista de vehículos disponibles en inventario.

        Aplica exclusión automática para vehículos en estado 'RESERVADO', 'ENTREGADO', 'EN_MANTENIMIENTO' o en cooldown
        de 2 horas ('EN_LIMPIEZA').
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum:
              - ALL
              - ECONOMICO
              - COMPACTO
              - SUV
              - PREMIUM
              - VAN
            default: ALL
        - name: transmission
          in: query
          required: false
          schema:
            type: string
            enum:
              - ALL
              - MANUAL
              - AUTOMATICO
            default: ALL
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Catálogo de vehículos disponibles recuperado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 4
                  limit:
                    type: integer
                    example: 10
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AutoVehiculoCardV2'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
      security: []
  /v2/autos/search:
    post:
      tags:
        - Autos - Catálogo y Búsqueda v2
      summary: Búsqueda avanzada de vehículos (Catálogo Híbrido v2 con Cooldown de 2h)
      description: >
        Consulta vehículos disponibles en el punto de recogida seleccionado con franjas horarias de 30 minutos.

        Aplica filtro de exclusión automática para vehículos en estado 'RESERVADO', 'ENTREGADO', 'EN_MANTENIMIENTO' o en
        ciclo de limpieza ('EN_LIMPIEZA' dentro del cooldown obligatorio de 2 horas).

        Evalúa edad del conductor para aplicar recargo joven (<25 años) o senior (>70 años), o rechazar con HTTP 422 si
        es menor de 18 años.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchAutosRequestV2'
      responses:
        '200':
          description: Lista de vehículos disponibles recuperada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAutosResponseV2'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '422':
          $ref: '#/components/responses/ProblemDetails422'
        '503':
          $ref: '#/components/responses/ProblemDetails503'
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      security: []
  /v2/autos/flota:
    get:
      tags:
        - Autos - Flota y Operaciones Mostrador v2
      summary: Consultar estado operativo de toda la flota con cronómetro de cooldown en vivo (Panel 2)
      description: >
        Endpoint consumido por el Panel 2 de Gestión de Flota de Autos.

        Reporta en tiempo real los 6 estados operativos de la flota, el conteo regresivo de 2 horas de cooldown
        (`segundos_restantes_cooldown`), timestamp estimado de disponibilidad y las alertas preventivas de kilometraje.
      responses:
        '200':
          description: Flota completa recuperada con telemetría de cooldown y kilometraje
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AutoFlotaItemV2'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      security: []
  /v2/autos/{id}/coberturas:
    get:
      tags:
        - Autos - Catálogo y Búsqueda v2
      summary: Consultar opciones de cobertura y seguros para un vehículo (Protección Básica vs Cobertura Total)
      description: >
        Retorna la comparativa oficial entre:

        1. **Protección Básica (Incluida):** Franquicia de $1,200.00 y retención de depósito de garantía en tarjeta de
        crédito.

        2. **Cobertura Total / Premium:** Franquicia de $0.00, depósito retenido de $0.00, protección integral de
        cristales, neumáticos, bajos y pérdida de llaves con recargo diario transparente.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: auto-spark-01
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '200':
          description: Opciones de cobertura desglosadas con franquicias y depósitos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoberturasResponseV2'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
      security: []
  /v2/autos/{id}:
    get:
      tags:
        - Autos - Catálogo y Búsqueda v2
      summary: Consultar detalle técnico de un vehículo por ID
      description: >-
        Retorna ficha técnica completa, imágenes, política de combustible ("Lleno a lleno"), kilometraje actual y estado
        operativo en la máquina de estados.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: auto-spark-01
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '200':
          description: Detalle del vehículo recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoVehiculoCardV2'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
      security: []
  /v2/autos/orders:
    get:
      tags:
        - Autos - Reservas y Check-in v2
      summary: Listar todas las órdenes de renta de autos (Consola de Gestión)
      description: Retorna el historial agregado de reservas de vehículos para el sistema de administración central.
      responses:
        '200':
          description: Lista de órdenes de renta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AutoOrderResponseV2'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
  /v2/autos/orders/create:
    post:
      tags:
        - Autos - Reservas y Check-in v2
      summary: Crear reserva de vehículo con Idempotency-Key y Cobertura (Transacción Saga)
      description: >
        Formaliza el alquiler de un vehículo. Transiciona el auto de 'DISPONIBLE' a 'RESERVADO'.

        Requiere cabecera obligatoria 'Idempotency-Key' para garantizar tolerancia a reintentos de red y emite el evento
        CloudEvent 'auto.order.confirmed'.

        Genera localizador PNR de 8 caracteres y código QR digital de retiro express.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAutoOrderRequestV2'
      responses:
        '201':
          description: Reserva creada y confirmada exitosamente con voucher QR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoOrderResponseV2'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '422':
          $ref: '#/components/responses/ProblemDetails422'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
        '503':
          $ref: '#/components/responses/ProblemDetails503'
  /v2/autos/reservas:
    post:
      tags:
        - Autos - Reservas y Check-in v2
      summary: Crear reserva de vehículo (Alias de compatibilidad v2)
      description: Endpoint alternativo equivalente a `/autos/orders/create` para compatibilidad de clientes.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAutoOrderRequestV2'
      responses:
        '201':
          description: Reserva de auto creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoOrderResponseV2'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '422':
          $ref: '#/components/responses/ProblemDetails422'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
        '503':
          $ref: '#/components/responses/ProblemDetails503'
  /v2/autos/reservas/{id}/checkin:
    post:
      tags:
        - Autos - Reservas y Check-in v2
      summary: Check-in digital anticipado para entrega rápida de llaves (Fast-Track)
      description: >
        Valida anticipadamente los datos de la licencia de conducir del cliente y genera el código QR para retiro
        express de llaves en mostrador.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - name: id
          in: path
          required: true
          description: ID de la reserva o PNR
          schema:
            type: string
          example: CAR7849B
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - documento_identidad
              properties:
                numero_licencia:
                  type: string
                  example: '1723456789'
                documento_identidad:
                  type: string
                  example: '1723456789'
                fecha_vencimiento_licencia:
                  type: string
                  format: date
                  example: '2028-12-31'
      responses:
        '200':
          description: Check-in validado exitosamente con voucher digital activado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinDigitalResponseV2'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /v2/autos/orders/{id}/checkin-entrega:
    post:
      tags:
        - Autos - Flota y Operaciones Mostrador v2
      summary: Check-in de Entrega en mostrador (Licencia física y Odómetro Inicial)
      description: >
        Operación presencial en mostrador efectuada por el agente de patio.

        Registra el odómetro inicial (`km_salida`), verifica la licencia física y transiciona el vehículo al estado
        'ENTREGADO' (fase en uso por el cliente según Cátedra RDA2 §5).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - name: id
          in: path
          required: true
          description: ID de la orden o código PNR
          schema:
            type: string
          example: CAR7849B
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinEntregaRequestV2'
      responses:
        '200':
          description: Entrega confirmada y vehículo puesto en estado ENTREGADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinEntregaResponseV2'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /v2/autos/orders/{id}/checkin-devolucion:
    post:
      tags:
        - Autos - Flota y Operaciones Mostrador v2
      summary: Check-in de Retorno e inicio inmediato del Cooldown de Limpieza de 2h
      description: >
        Operación presencial efectuada al recibir el vehículo en patio.

        Registra el odómetro final (`km_retorno`), calcula los kilómetros recorridos totales, actualiza el nivel de
        combustible y transiciona inmediatamente el vehículo al estado 'EN_LIMPIEZA' con un cooldown estricto de 2 horas
        (120 minutos).

        Si el odómetro supera el umbral programado, activa la alerta de mantenimiento preventivo.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - name: id
          in: path
          required: true
          description: ID de la orden o código PNR
          schema:
            type: string
          example: CAR7849B
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinDevolucionRequestV2'
      responses:
        '200':
          description: Devolución procesada, orden completada y cooldown de 2 horas iniciado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinDevolucionResponseV2'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
  /v2/autos/orders/{orderId}:
    get:
      tags:
        - Autos - Reservas y Check-in v2
      summary: Consultar orden o reserva de auto por ID o PNR
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          example: CAR7849B
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
