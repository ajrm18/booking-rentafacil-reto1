  /v2/autos/orders/{orderId}/cancel:
    post:
      tags:
        - Autos - Reservas y Check-in v2
      summary: Cancelar una orden de renta existente (Compensación Saga LIFO con Reembolso 100%)
      description: >
        Ejecuta la compensación distribuida para la renta de autos.

        Libera el vehículo a estado 'DISPONIBLE', emite código de compensación 'REF-AUTO-...' y procesa el reembolso del
        100% sin penalización conforme al Patrón Saga.

        Emite el evento CloudEvent 'auto.order.cancelled'.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          example: CAR7849B
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: Cambio de itinerario de vuelo
                motivo:
                  type: string
                  example: Cambio de itinerario de vuelo
                solicitante:
                  type: string
                  enum:
                    - CLIENTE
                    - SAGA_ORCHESTRATOR
                    - ADMIN
                  example: SAGA_ORCHESTRATOR
                  description: Identifica si la cancelación es un rollback compensatorio de la Saga o un autoservicio del cliente.
      responses:
        '200':
          description: Orden cancelada exitosamente, vehículo liberado a DISPONIBLE y reembolso procesado
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_id:
                    type: string
                    example: CAR7849B
                  pnr:
                    type: string
                    example: CAR7849B
                  status:
                    type: string
                    example: CANCELLED
                  auto_id:
                    type: string
                    example: auto-spark-01
                  refund:
                    type: object
                    properties:
                      refund_id:
                        type: string
                        example: REF-AUTO-9921
                      amount:
                        type: number
                        example: 106.5
                      currency:
                        type: string
                        example: USD
                      percentage:
                        type: integer
                        example: 100
                      status:
                        type: string
                        example: PROCESSED
                  inventory_restoration:
                    type: object
                    properties:
                      status:
                        type: string
                        example: RESTORED
                      vehicle_id:
                        type: string
                        example: auto-spark-01
                      new_state:
                        type: string
                        example: DISPONIBLE
                  message:
                    type: string
                    example: Orden de renta cancelada exitosamente. Vehículo liberado y reembolso procesado.
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
