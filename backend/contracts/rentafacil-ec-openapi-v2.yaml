components:
  schemas:
    EstadoVehiculoEnum:
      type: string
      description: Las 6 fases formales de la máquina de estados vehicular exigidas por Cátedra RDA2 §5
      enum:
        - DISPONIBLE
        - RESERVADO
        - LISTO_PARA_ENTREGAR
        - ENTREGADO
        - EN_LIMPIEZA
        - EN_MANTENIMIENTO
      example: DISPONIBLE
    SearchAutosRequestV2:
      type: object
      required:
        - pickup_location
        - pickup_date
        - pickup_time
        - dropoff_date
        - dropoff_time
      properties:
        pickup_location:
          type: string
          description: Punto de recogida (Ciudad o código IATA como UIO, GYE)
          example: Aeropuerto Mariscal Sucre (UIO), Quito
        dropoff_location:
          type: string
          description: Punto de devolución (Mismo punto o trayecto único)
          example: Aeropuerto Mariscal Sucre (UIO), Quito
        pickup_date:
          type: string
          format: date
          example: '2026-10-20'
        pickup_time:
          type: string
          description: Franja horaria estricta en intervalos de 30 minutos
          example: '10:00'
        dropoff_date:
          type: string
          format: date
          example: '2026-10-23'
        dropoff_time:
          type: string
          description: Franja horaria estricta en intervalos de 30 minutos
          example: '10:00'
        driver_age:
          type: integer
          description: >-
            Edad del conductor principal (menores de 25 o mayores de 70 aplican recargo; menores de 18 son rechazados
            con HTTP 422)
          example: 32
        driver_age_bracket:
          type: boolean
          description: True si el conductor tiene entre 30 y 65 años (estándar sin recargo)
          default: true
        category:
          type: string
          enum:
            - ALL
            - ECONOMICO
            - COMPACTO
            - SUV
            - PREMIUM
            - VAN
          default: ALL
        transmission:
          type: string
          enum:
            - ALL
            - MANUAL
            - AUTOMATICO
          default: ALL
    SearchAutosResponseV2:
      type: object
      properties:
        request_id:
          type: string
          example: req-autos-179200
        metadata:
          type: object
          properties:
            total_results:
              type: integer
              example: 5
            surcharge_applied:
              type: boolean
              description: Aplica si edad < 25 o > 70
              example: false
            surcharge_amount:
              type: number
              example: 0
            pickup_location:
              type: string
              example: UIO
            pickup_date:
              type: string
              example: '2026-10-20'
            dropoff_date:
              type: string
              example: '2026-10-23'
        data:
          type: array
          items:
            $ref: '#/components/schemas/AutoVehiculoCardV2'
    AutoVehiculoCardV2:
      type: object
      properties:
        vehicle_id:
          type: string
          example: auto-spark-01
        marca:
          type: string
          example: Chevrolet
        modelo:
          type: string
          example: Spark GT
        categoria:
          type: string
          example: ECONOMICO
        precio_diario:
          type: number
          format: float
          example: 35.5
        precio_total:
          type: number
          format: float
          example: 106.5
        moneda:
          type: string
          example: USD
        transmision:
          type: string
          example: MANUAL
        asientos:
          type: integer
          example: 5
        puertas:
          type: integer
          example: 4
        maletas_grandes:
          type: integer
          example: 1
        maletas_pequenas:
          type: integer
          example: 1
        aire_acondicionado:
          type: boolean
          example: true
        kilometraje_ilimitado:
          type: boolean
          example: true
        politica_combustible:
          type: string
          example: LLENO_A_LLENO
        cancelacion_gratuita:
          type: boolean
          example: true
        proveedor:
          type: object
          properties:
            nombre:
              type: string
              example: Europcar
            rating:
              type: number
              example: 8.4
            ubicacion:
              type: string
              example: En la terminal aérea (Terminal Llegadas)
        estado:
          $ref: '#/components/schemas/EstadoVehiculoEnum'
        kilometraje_actual:
          type: integer
          example: 5200
        proximo_mantenimiento_km:
          type: integer
          example: 10000
        mantenimiento_requerido:
          type: boolean
          example: false
        foto_url:
          type: string
          example: https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?w=600
        images:
          type: array
          items:
            type: string
        auto_id:
          type: string
          description: Alias canónico en español para vehicle_id.
          example: auto-spark-01
        id:
          type: string
          description: Identificador público del vehículo.
          example: auto-spark-01
        brand:
          type: string
          description: English alias for car brand.
          example: Chevrolet
        model:
          type: string
          description: English alias for car model.
          example: Spark GT
        category:
          type: string
          description: English alias for vehicle category.
          example: ECONOMICO
        daily_price:
          type: number
          description: English alias for daily price in USD.
          example: 35.5
        total_price_usd:
          type: number
          description: Total price for selected dates.
          example: 106.5
        currency:
          type: string
          example: USD
        transmission:
          type: string
          example: MANUAL
        seats:
          type: integer
          example: 4
        doors:
          type: integer
          example: 5
        air_conditioning:
          type: boolean
          example: true
        unlimited_mileage:
          type: boolean
          example: true
        fuel_policy:
          type: string
          example: Lleno a Lleno (Full-to-Full)
        free_cancellation:
          type: boolean
          example: true
    AutoFlotaItemV2:
      type: object
      description: Registro operativo de un vehículo en el Panel 2 de Gestión de Flota
      properties:
        id:
          type: string
          example: auto-spark-01
        marca:
          type: string
          example: Chevrolet
        modelo:
          type: string
          example: Spark GT
        categoria:
          type: string
          example: ECONOMICO
        precio_diario:
          type: number
          example: 35.5
        estado_operativo:
          $ref: '#/components/schemas/EstadoVehiculoEnum'
        cooldown_activo:
          type: boolean
          description: True si el auto está en la fase 'EN_LIMPIEZA' con conteo regresivo
          example: false
        segundos_restantes_cooldown:
          type: integer
          description: Segundos restantes de las 2 horas de enfriamiento (0 si ya expiró o no aplica)
          example: 5400
        disponible_estimado_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-22T14:30:00Z'
        kilometraje_actual:
          type: integer
          example: 5200
        umbral_mantenimiento_km:
          type: integer
          example: 10000
        alerta_mantenimiento:
          type: boolean
          description: True si kilometraje_actual >= umbral_mantenimiento_km
          example: false
        foto_url:
          type: string
          example: https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?w=600
    CoberturasResponseV2:
      type: object
      properties:
        auto_id:
          type: string
          example: auto-spark-01
        vehiculo:
          type: string
          example: Chevrolet Spark GT
        opciones:
          type: array
          items:
            type: object
            properties:
              tipo:
                type: string
                enum:
                  - BASICA
                  - TOTAL
              nombre:
                type: string
                example: Cobertura Total / Protección Premium
              costo_adicional_diario:
                type: number
                example: 18
              franquicia:
                type: number
                description: Monto de franquicia (0 en Cobertura Total)
                example: 0
              deposito_garantia:
                type: number
                description: Depósito retenido en mostrador en tarjeta de crédito
                example: 0
              descripcion:
                type: string
                example: Elimina totalmente la franquicia ante daños en carrocería, cristales, neumáticos y llaves.
              beneficios:
                type: array
                items:
                  type: string
    CreateAutoOrderRequestV2:
      type: object
      required:
        - vehicle_id
        - pickup_date
        - dropoff_date
        - conductor
      properties:
        vehicle_id:
          type: string
          example: auto-spark-01
        dias:
          type: integer
          example: 3
        tipo_cobertura:
          type: string
          enum:
            - BASICA
            - TOTAL
          default: BASICA
        pickup_location:
          type: string
          example: Aeropuerto Mariscal Sucre (UIO), Quito
        dropoff_location:
          type: string
          example: Aeropuerto Mariscal Sucre (UIO), Quito
        pickup_date:
          type: string
          format: date
          example: '2026-10-20'
        dropoff_date:
          type: string
          format: date
          example: '2026-10-23'
        conductor:
          type: object
          required:
            - nombre
            - email
            - telefono
            - licencia_conducir
          properties:
            nombre:
              type: string
              example: Carlos Andrés Zambrano
            email:
              type: string
              format: email
              example: carlos.zambrano@example.com
            telefono:
              type: string
              example: '+593987654321'
            licencia_conducir:
              type: string
              example: '1723456789'
            pais_licencia:
              type: string
              example: Ecuador
            edad:
              type: integer
              example: 32
            numero_vuelo:
              type: string
              example: AV1632
            nombre_completo:
              type: string
              example: Dilan Flores
            full_name:
              type: string
              example: Dilan Flores
            correo:
              type: string
              format: email
              example: dilan.flores@epn.edu.ec
            phone:
              type: string
              example: '+593987654321'
            edad_conductor:
              type: integer
              example: 28
            driver_age:
              type: integer
              example: 28
        auto_id:
          type: string
          description: Alias canónico en español para identificador del vehículo.
          example: auto-spark-01
        fecha_recogida:
          type: string
          format: date
          description: Alias canónico en español para fecha de retiro (YYYY-MM-DD).
          example: '2026-11-10'
        fecha_devolucion:
          type: string
          format: date
          description: Alias canónico en español para fecha de retorno (YYYY-MM-DD).
          example: '2026-11-12'
        hora_recogida:
          type: string
          description: Hora militar estricta en intervalos de 30 minutos (ej. 10:00 o 10:30).
          example: '10:00'
        hora_devolucion:
          type: string
          description: Hora militar estricta en intervalos de 30 minutos (ej. 10:00 o 10:30).
          example: '10:00'
        lugar_recogida:
          type: string
          description: Alias canónico en español para terminal u oficina de retiro.
          example: UIO Aeropuerto
        lugar_devolucion:
          type: string
          description: Alias canónico en español para terminal u oficina de retorno.
          example: UIO Aeropuerto
        cobertura:
          type: string
          enum:
            - BASICA
            - TOTAL
            - PREMIUM
          description: Alias canónico en español para nivel de cobertura del seguro.
          example: TOTAL
        idempotency_key:
          type: string
          format: uuid
          deprecated: true
          description: >-
            DEPRECATED (IETF Draft). La clave de idempotencia DEBE transmitirse en la cabecera HTTP Idempotency-Key para
            evitar colisiones semánticas.
    AutoOrderResponseV2:
      type: object
      properties:
        order_id:
          type: string
          example: CAR7849B
        pnr:
          type: string
          example: CAR7849B
        status:
          type: string
          example: CONFIRMED
        auto_id:
          type: string
          example: auto-spark-01
        tipo_cobertura:
          type: string
          example: TOTAL
        deposito_garantia:
          type: number
          example: 0
        total_price:
          type: object
          properties:
            currency:
              type: string
              example: USD
            total:
              type: number
              example: 160.5
            desglose:
              type: object
        voucher_qr_data:
          type: string
          example: BOOKING-CAR-CAR7849B-auto-spark-01-CONFIRMED
        checklist_mostrador:
          type: array
          items:
            type: string
        refund:
          type: object
          nullable: true
          properties:
            refund_id:
              type: string
              example: REF-AUTO-9921
            amount:
              type: number
              example: 160.5
            currency:
              type: string
              example: USD
            status:
              type: string
              example: PROCESSED
            message:
              type: string
        _links:
          type: object
        codigo_reserva:
          type: string
          description: Alias canónico en español para localizador PNR.
          example: CAR7849B
        estado:
          type: string
          description: Alias canónico en español para estado de la reserva.
          example: CONFIRMED
        moneda:
          type: string
          description: Divisa de liquidación (USD).
          example: USD
        precio_total_monto:
          type: number
          description: Monto total en USD.
          example: 106.5
        reembolso_id:
          type: string
          description: Identificador del reembolso monetario ante cancelación o compensación Saga.
          example: REF-AUTO-9921
        monto_reembolsado:
          type: number
          description: Monto reembolsado al 100% en USD.
          example: 106.5
        cooldown_info:
          $ref: '#/components/schemas/CooldownStatusDto'
    CheckinDigitalResponseV2:
      type: object
      properties:
        reserva_id:
          type: string
          example: CAR7849B
        pnr:
          type: string
          example: CAR7849B
        checkin_status:
          type: string
          example: CHECKIN_COMPLETED
        fast_track_pickup:
          type: boolean
          example: true
        mensaje:
          type: string
          example: Check-in digital exitoso. Presenta tu código QR en el mostrador para retiro express.
        voucher_qr_data:
          type: string
          example: AUTOS-CHECKIN-CAR7849B-VERIFIED-1723456789
        requisitos:
          type: array
          items:
            type: string
    CheckinEntregaRequestV2:
      type: object
      required:
        - licencia_conducir
        - km_salida
      properties:
        licencia_conducir:
          type: string
          description: Número de licencia física presentada en mostrador
          example: '1723456789'
        km_salida:
          type: integer
          description: Lectura del odómetro al momento de entregar las llaves
          example: 12500
        tecnico_entrega:
          type: string
          description: Nombre o ID del agente que formaliza la entrega
          example: Roberto Paredes (Agente Mostrador UIO)
    CheckinEntregaResponseV2:
      type: object
      properties:
        success:
          type: boolean
          example: true
        order_id:
          type: string
          example: CAR7849B
        pnr:
          type: string
          example: CAR7849B
        estado_orden:
          type: string
          example: ENTREGADO
        km_salida:
          type: integer
          example: 12500
        licencia_verificada:
          type: string
          example: '1723456789'
        mensaje:
          type: string
          example: Llaves entregadas al conductor. Auto en tránsito (Fase ENTREGADO).
    CheckinDevolucionRequestV2:
      type: object
      required:
        - km_retorno
      properties:
        km_retorno:
          type: integer
          description: Odómetro al devolver el auto (debe ser >= km_salida)
          example: 12950
        nivel_combustible:
          type: integer
          description: Porcentaje de combustible de 0 a 100
          example: 100
        observaciones:
          type: string
          example: Inspección conforme. Sin rayones ni novedades mecánicas.
    CheckinDevolucionResponseV2:
      type: object
      properties:
        success:
          type: boolean
