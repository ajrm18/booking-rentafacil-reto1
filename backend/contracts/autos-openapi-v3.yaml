          example: Aeropuerto Mariscal Sucre (UIO), Quito
        dropoff_location:
          type: string
          description: Punto de devolución (Mismo punto o trayecto único)
          example: Aeropuerto Mariscal Sucre (UIO), Quito
        pickup_date:
          type: string
          format: date
          example: '2026-10-20'
        pickup_time:
          type: string
          description: Franja horaria estricta en intervalos de 30 minutos
          example: '10:00'
        dropoff_date:
          type: string
          format: date
          example: '2026-10-23'
        dropoff_time:
          type: string
          description: Franja horaria estricta en intervalos de 30 minutos
          example: '10:00'
        driver_age:
