openapi: 3.0.3
info:
  title: API de Renta de Autos y Gestión de Flota (Booking Prototipo RDA2 - Versión
    Canónica v3)
  version: 3.0.0
  description: "# Contrato Oficial Canónico de Integración — Vertical de Renta de\
    \ Autos (RDA2 v3.0.0)\n\n> **Sistema Emisor / Proveedor:** Tiendas y Concesionarias\
    \ de Renta de Autos (Páginas Individuales de Compañeros RDA2)  \n> **Sistema Consumidor\
    \ / Agregador Central:** Booking Prototipo (Marketplace Multimodal — Paúl Rosero)\
    \  \n> **Asignatura:** Integración de Sistemas — 6to Semestre (Reto 2: RDA2 /\
    \ Semana 9)  \n> **Estándar:** OpenAPI Specification 3.0.3 (API-First, REST HATEOAS\
    \ Nivel 3, RFC 7807 Problem Details, CloudEvents v1.0)  \n> **Documento Canónico:**\
    \ `contracts/autos-openapi-v3.yaml`  \n> **Versión:** 3.0.0 (Resolución de Ambigüedades\
    \ de Idioma, Estandarización de Sagas y Sincronización gRPC)\n\n---\n\n## 1. Novedades\
    \ y Mejoras Clave de la Versión 3.0.0 (Semana 9)\n\n1. **Estandarización 100%\
    \ en Inglés para Campos Requeridos (Indicaciones Semana 9 §8):**\n   - Se eliminaron\
    \ las duplicidades de nombres de atributos (`conductor` -> `driver`, `nombre`/`full_name`,\
    \ `correo`/`email`, `telefono`/`phone`).\n   - Las propiedades canónicas obligatorias\
    \ para reservas son: `vehicle_id`, `pickup_date`, `dropoff_date`, `driver` (`full_name`,\
    \ `email`, `phone`, `license_number`, `age`).\n   - Se mantiene tolerancia pasiva\
    \ de lectura para clientes que envíen alias en español (*Ley de Postel*).\n\n\
    2. **Resolución de Servidores Canónicos de Producción:**\n   - La URL canónica\
    \ apunta a Render: `https://rda1-backend-integracion-sistemas.onrender.com/api/v3`.\n\
    \   - Se habilitan rutas de entorno de desarrollo (`http://localhost:3000/api/v3`)\
    \ y compatibilidad hacia atrás (`/api/v2` y `/api/v1`).\n\n3. **Estandarización\
    \ Canónica de Errores para Sagas Distribuidas (RFC 7807):**\n   - **`409 Conflict`\
    \ (`VEHICLE_UNAVAILABLE`, `OUT_OF_STOCK`, `VEHICLE_IN_CLEANING_COOLDOWN`):** Es\
    \ el **ÚNICO** código que activa compensaciones LIFO en el orquestador de Sagas\
    \ del Booking.\n   - **`422 Unprocessable Entity` (`DRIVER_UNDERAGE`, `INVALID_DATES`,\
    \ `INVALID_PAYLOAD`):** Errores semánticos y de cliente; **NO** disparan compensaciones\
    \ de Saga.\n   - **`400 Bad Request` (`MALFORMED_REQUEST`, `IDEMPOTENCY_CONFLICT`):**\
    \ Errores de sintaxis o conflicto de idempotencia.\n\n4. **Máquina de Estados\
    \ Finita de Flota (Consideraciones RDA2 §5):**\n   - Ciclo de vida oficial: `DISPONIBLE`\
    \ ➔ `RESERVADO` ➔ `LISTO_PARA_ENTREGAR` ➔ `ENTREGADO` ➔ `EN_LIMPIEZA` ➔ `EN_MANTENIMIENTO`.\n\
    \   - **Cooldown de 2 Horas (120 min):** Tras el retorno del auto, queda en `EN_LIMPIEZA`.\
    \ Bloqueado para nuevas reservas. Si se intenta reservar, responde `409 Conflict`.\n\
    \   - **Alertas de Odómetro:** Cuando `current_mileage >= next_maintenance_km`,\
    \ se activa alerta preventiva auditable.\n\n5. **Sincronización Asimétrica con\
    \ gRPC (`src/proto/inventory.proto`):**\n   - Las concesionarias envían actualizaciones\
    \ de stock a Booking vía gRPC (`InventoryStockService.PushStockUpdate`).\n   -\
    \ Para autos: `available_units = 1` (disponible) o `0` (reservado / en limpieza\
    \ / entregado).\n"
servers:
- url: /api/v3
  description: API Gateway Booking Prototipo — Ruta base canónica v3 (Producción /
    Local)
- url: https://rda1-backend-integracion-sistemas.onrender.com/api/v3
  description: Servidor de Producción Desplegado en Render (HTTPS)
- url: http://localhost:3000/api/v3
  description: Entorno de Desarrollo Local del Gateway NestJS
- url: /api/v2
  description: Ruta de compatibilidad v2
- url: /api/v1
  description: Ruta Legacy v1
tags:
- name: Autos - Catálogo y Búsqueda v2
  description: Búsqueda avanzada con franjas horarias de 30m, catálogo general de
    vehículos y especificaciones técnicas.
- name: Autos - Reservas y Check-in v2
  description: Creación de reservas con Idempotency-Key, coberturas, check-in digital
    express y compensación Saga.
- name: Autos - Flota y Operaciones Mostrador v2
  description: Panel de flota con cronómetro de cooldown en vivo, check-in de entrega
    y check-in de devolución.
- name: Autos - Mantenimiento y Auditoría v2
  description: Endpoints técnicos protegidos para registro de odómetro, revisión física
    y alertas preventivas.
- name: Autos - Promociones B2B y Combos v2
  description: Consulta y formalización de acuerdos comerciales para paquetes turísticos
    conforme a Cátedra RDA2 §9.
- name: Autos - Telemetría y Salud de Nodo v2
  description: Endpoints de monitoreo de salud para el Semáforo LED (🟢/🔴) del Panel
    1 de Administración y feed Outbox EDA.
paths:
  /autos/health:
    get:
      tags:
      - Autos - Telemetría y Salud de Nodo v2
      summary: Healthcheck y telemetría de nodo del microservicio de Autos (Semáforo
        🟢/🔴 RDA2 CE01)
      description: 'Endpoint consumido por el Monitor de Nodos del Booking Prototipo
        (Panel 1).

        Reporta el estado operativo (''HEALTHY'', ''DOWN'', ''DEGRADED''), latencia,
        uptime y métricas de vehículos en cooldown para alimentar el semáforo LED
        visual de auditoría.

        '
      responses:
        '200':
          description: Nodo de autos operativo y saludable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutosHealthResponseV2'
        '503':
          $ref: '#/components/responses/ProblemDetails503'
      parameters: []
      security: []
  /autos/promociones/contrato:
    get:
      tags:
      - Autos - Promociones B2B y Combos v2
      summary: Consultar acuerdo comercial B2B para combos y promociones (Cátedra
        RDA2 §9)
      description: 'Retorna el estado del acuerdo comercial pactado entre la tienda
        de autos y Booking Prototipo para la creación de paquetes turísticos multidominio.

        Responde a la exigencia de la Cátedra RDA2 §9: verificar si el partner acepta
        promociones y cuál es el porcentaje máximo de descuento autorizado.

        '
      responses:
        '200':
          description: Términos comerciales de promociones recuperados exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratoPromocionesResponseV2'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
        '401': &id001
          $ref: '#/components/responses/ProblemDetails401'
        '403': &id002
          $ref: '#/components/responses/ProblemDetails403'
      parameters:
      - &id003
        $ref: '#/components/parameters/XCorrelationIdHeader'
    put:
      tags:
      - Autos - Promociones B2B y Combos v2
      summary: Actualizar o formalizar acuerdo B2B de promociones y combos (Cátedra
        RDA2 §9)
      description: 'Permite a la tienda socia (o a su agente inteligente) responder
        oficialmente a las preguntas de la cátedra:

        1. ¿Acepta participar en la creación de promociones y combos de paquetes turísticos?
        (`permite_promociones`)

        2. ¿Cuál es el porcentaje máximo de descuento que autoriza aplicar? (`porcentaje_descuento_maximo`)

        3. ¿En qué ciudades aplica el convenio? (`destinos_habilitados`)

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContratoPromocionesRequestV2'
      responses:
        '200':
          description: Acuerdo comercial formalizado y actualizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  mensaje:
                    type: string
                    example: Acuerdo B2B de promociones y combos actualizado exitosamente.
                  contrato:
                    $ref: '#/components/schemas/ContratoPromocionesResponseV2'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401': *id001
        '403': *id002
        '500': &id004
          $ref: '#/components/responses/ProblemDetails500'
      parameters:
      - &id006
        $ref: '#/components/parameters/IdempotencyKeyHeader'
      - *id003
  /autos/eventos:
    get:
      tags:
      - Autos - Telemetría y Salud de Nodo v2
      summary: Feed Outbox de eventos asíncronos para streaming EDA (RabbitMQ / Kafka)
      description: 'Mecanismo Transactional Outbox que expone los eventos emitidos
        por el microservicio de autos para streaming y sincronización con Apache Kafka
        y RabbitMQ.

        '
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 10
        example: 10
      - name: after
        in: query
        required: false
        schema:
          type: string
        example: evt-car-100
      - *id003
      responses:
        '200':
          description: Feed de eventos recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutosEventosResponseV2'
        '401': *id001
        '403': *id002
        '500': *id004
  /autos:
    get:
      tags:
      - Autos - Catálogo y Búsqueda v2
      summary: Listar catálogo general de vehículos disponibles
      description: 'Retorna la lista de vehículos disponibles en inventario.

        Aplica exclusión automática para vehículos en estado ''RESERVADO'', ''ENTREGADO'',
        ''EN_MANTENIMIENTO'' o en cooldown de 2 horas (''EN_LIMPIEZA'').

        '
      parameters:
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum:
          - ALL
          - ECONOMICO
          - COMPACTO
          - SUV
          - PREMIUM
          - VAN
          default: ALL
      - name: transmission
        in: query
        required: false
        schema:
          type: string
          enum:
          - ALL
          - MANUAL
          - AUTOMATICO
          default: ALL
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 10
      responses:
        '200':
          description: Catálogo de vehículos disponibles recuperado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 4
                  limit:
                    type: integer
                    example: 10
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AutoVehiculoCardV2'
        '500': *id004
      security: []
  /autos/search:
    post:
      tags:
      - Autos - Catálogo y Búsqueda v2
      summary: Búsqueda avanzada de vehículos (Catálogo Híbrido v2 con Cooldown de
        2h)
      description: 'Consulta vehículos disponibles en el punto de recogida seleccionado
        con franjas horarias de 30 minutos.

        Aplica filtro de exclusión automática para vehículos en estado ''RESERVADO'',
        ''ENTREGADO'', ''EN_MANTENIMIENTO'' o en ciclo de limpieza (''EN_LIMPIEZA''
        dentro del cooldown obligatorio de 2 horas).

        Evalúa edad del conductor para aplicar recargo joven (<25 años) o senior (>70
        años), o rechazar con HTTP 422 si es menor de 18 años.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchAutosRequestV2'
      responses:
        '200':
          description: Lista de vehículos disponibles recuperada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAutosResponseV2'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '422':
          $ref: '#/components/responses/ProblemDetails422'
        '503':
          $ref: '#/components/responses/ProblemDetails503'
      parameters:
      - &id005
        $ref: '#/components/parameters/XCorrelationIdHeader'
      security: []
  /autos/flota:
    get:
      tags:
      - Autos - Flota y Operaciones Mostrador v2
      summary: Consultar estado operativo de toda la flota con cronómetro de cooldown
        en vivo (Panel 2)
      description: 'Endpoint consumido por el Panel 2 de Gestión de Flota de Autos.

        Reporta en tiempo real los 6 estados operativos de la flota, el conteo regresivo
        de 2 horas de cooldown (`segundos_restantes_cooldown`), timestamp estimado
        de disponibilidad y las alertas preventivas de kilometraje.

        '
      responses:
        '200':
          description: Flota completa recuperada con telemetría de cooldown y kilometraje
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AutoFlotaItemV2'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
      parameters:
      - *id005
      security: []
  /autos/{id}/coberturas:
    get:
      tags:
      - Autos - Catálogo y Búsqueda v2
      summary: Consultar opciones de cobertura y seguros para un vehículo (Protección
        Básica vs Cobertura Total)
      description: 'Retorna la comparativa oficial entre:

        1. **Protección Básica (Incluida):** Franquicia de $1,200.00 y retención de
        depósito de garantía en tarjeta de crédito.

        2. **Cobertura Total / Premium:** Franquicia de $0.00, depósito retenido de
        $0.00, protección integral de cristales, neumáticos, bajos y pérdida de llaves
        con recargo diario transparente.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: auto-spark-01
      - *id005
      responses:
        '200':
          description: Opciones de cobertura desglosadas con franquicias y depósitos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoberturasResponseV2'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500': *id004
      security: []
  /autos/{id}:
    get:
      tags:
      - Autos - Catálogo y Búsqueda v2
      summary: Consultar detalle técnico de un vehículo por ID
      description: Retorna ficha técnica completa, imágenes, política de combustible
        ("Lleno a lleno"), kilometraje actual y estado operativo en la máquina de
        estados.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: auto-spark-01
      - *id005
      responses:
        '200':
          description: Detalle del vehículo recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoVehiculoCardV2'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500': *id004
      security: []
  /autos/orders:
    get:
      tags:
      - Autos - Reservas y Check-in v2
      summary: Listar todas las órdenes de renta de autos (Consola de Gestión)
      description: Retorna el historial agregado de reservas de vehículos para el
        sistema de administración central.
      responses:
        '200':
          description: Lista de órdenes de renta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AutoOrderResponseV2'
        '401': *id001
        '403': *id002
        '500': *id004
      parameters:
      - *id003
  /autos/orders/create:
    post:
      tags:
      - Autos - Reservas y Check-in v2
      summary: Crear reserva de vehículo con Idempotency-Key y Cobertura (Transacción
        Saga)
      description: 'Formaliza el alquiler de un vehículo. Transiciona el auto de ''DISPONIBLE''
        a ''RESERVADO''.

        Requiere cabecera obligatoria ''Idempotency-Key'' para garantizar tolerancia
        a reintentos de red y emite el evento CloudEvent ''auto.order.confirmed''.

        Genera localizador PNR de 8 caracteres y código QR digital de retiro express.

        '
      parameters:
      - *id006
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAutoOrderRequestV2'
      responses:
        '201':
          description: Reserva creada y confirmada exitosamente con voucher QR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoOrderResponseV2'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '422':
          $ref: '#/components/responses/ProblemDetails422'
        '503':
          $ref: '#/components/responses/ProblemDetails503'
        '401': *id001
        '403': *id002
        '500': *id004
  /autos/reservas:
    post:
      tags:
      - Autos - Reservas y Check-in v2
      summary: Crear reserva de vehículo (Alias de compatibilidad v2)
      description: Endpoint alternativo equivalente a `/autos/orders/create` para
        compatibilidad de clientes.
      parameters:
      - *id006
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAutoOrderRequestV2'
      responses:
        '201':
          description: Reserva de auto creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoOrderResponseV2'
        '409': &id009
          $ref: '#/components/responses/ProblemDetails409'
        '401': *id001
        '403': *id002
        '500': *id004
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '422':
          $ref: '#/components/responses/ProblemDetails422'
        '503':
          $ref: '#/components/responses/ProblemDetails503'
  /autos/reservas/{id}/checkin:
    post:
      tags:
      - Autos - Reservas y Check-in v2
      summary: Check-in digital anticipado para entrega rápida de llaves (Fast-Track)
      description: 'Valida anticipadamente los datos de la licencia de conducir del
        cliente y genera el código QR para retiro express de llaves en mostrador.

        '
      parameters:
      - *id006
      - name: id
        in: path
        required: true
        description: ID de la reserva o PNR
        schema:
          type: string
        example: CAR7849B
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - documento_identidad
              properties:
                numero_licencia:
                  type: string
                  example: '1710034065'
                documento_identidad:
                  type: string
                  example: '1710034065'
                fecha_vencimiento_licencia:
                  type: string
                  format: date
                  example: '2028-12-31'
      responses:
        '200':
          description: Check-in validado exitosamente con voucher digital activado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinDigitalResponseV2'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '401': *id001
        '403': *id002
        '500': *id004
        '400': &id007
          $ref: '#/components/responses/ProblemDetails400'
        '409': &id008
          $ref: '#/components/responses/ProblemDetails409'
  /autos/orders/{id}/checkin-entrega:
    post:
      tags:
      - Autos - Flota y Operaciones Mostrador v2
      summary: Check-in de Entrega en mostrador (Licencia física y Odómetro Inicial)
      description: 'Operación presencial en mostrador efectuada por el agente de patio.

        Registra el odómetro inicial (`km_salida`), verifica la licencia física y
        transiciona el vehículo al estado ''ENTREGADO'' (fase en uso por el cliente
        según Cátedra RDA2 §5).

        '
      parameters:
      - *id006
      - name: id
        in: path
        required: true
        description: ID de la orden o código PNR
        schema:
          type: string
        example: CAR7849B
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinEntregaRequestV2'
      responses:
        '200':
          description: Entrega confirmada y vehículo puesto en estado ENTREGADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinEntregaResponseV2'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '401': *id001
        '403': *id002
        '500': *id004
        '400': *id007
        '409': *id008
  /autos/orders/{id}/checkin-devolucion:
    post:
      tags:
      - Autos - Flota y Operaciones Mostrador v2
      summary: Check-in de Retorno e inicio inmediato del Cooldown de Limpieza de
        2h
      description: 'Operación presencial efectuada al recibir el vehículo en patio.

        Registra el odómetro final (`km_retorno`), calcula los kilómetros recorridos
        totales, actualiza el nivel de combustible y transiciona inmediatamente el
        vehículo al estado ''EN_LIMPIEZA'' con un cooldown estricto de 2 horas (120
        minutos).

        Si el odómetro supera el umbral programado, activa la alerta de mantenimiento
        preventivo.

        '
      parameters:
      - *id006
      - name: id
        in: path
        required: true
        description: ID de la orden o código PNR
        schema:
          type: string
        example: CAR7849B
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinDevolucionRequestV2'
      responses:
        '200':
          description: Devolución procesada, orden completada y cooldown de 2 horas
            iniciado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinDevolucionResponseV2'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '401': *id001
        '403': *id002
        '500': *id004
        '400': *id007
        '409': *id008
  /autos/orders/{orderId}:
    get:
      tags:
      - Autos - Reservas y Check-in v2
      summary: Consultar orden o reserva de auto por ID o PNR
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
        example: CAR7849B
      - *id003
      responses:
        '200':
          description: Detalle de la orden de renta recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoOrderResponseV2'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '401': *id001
        '403': *id002
        '500': *id004
  /autos/orders/{orderId}/cancel:
    post:
      tags:
      - Autos - Reservas y Check-in v2
      summary: Cancelar una orden de renta existente (Compensación Saga LIFO con Reembolso
        100%)
      description: 'Ejecuta la compensación distribuida para la renta de autos.

        Libera el vehículo a estado ''DISPONIBLE'', emite código de compensación ''REF-AUTO-...''
        y procesa el reembolso del 100% sin penalización conforme al Patrón Saga.

        Emite el evento CloudEvent ''auto.order.cancelled''.

        '
      parameters:
      - *id006
      - name: orderId
        in: path
        required: true
        schema:
          type: string
        example: CAR7849B
      - *id003
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: Cambio de itinerario de vuelo
                motivo:
                  type: string
                  example: Cambio de itinerario de vuelo
                solicitante:
                  type: string
                  enum:
                  - CLIENTE
                  - SAGA_ORCHESTRATOR
                  - ADMIN
                  example: SAGA_ORCHESTRATOR
                  description: Identifica si la cancelación es un rollback compensatorio
                    de la Saga o un autoservicio del cliente.
      responses:
        '200':
          description: Orden cancelada exitosamente, vehículo liberado a DISPONIBLE
            y reembolso procesado
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_id:
                    type: string
                    example: CAR7849B
                  pnr:
                    type: string
                    example: CAR7849B
                  status:
                    type: string
                    example: CANCELLED
                  auto_id:
                    type: string
                    example: auto-spark-01
                  refund:
                    type: object
                    properties:
                      refund_id:
                        type: string
                        example: REF-AUTO-9921
                      amount:
                        type: number
                        example: 106.5
                      currency:
                        type: string
                        example: USD
                      percentage:
                        type: integer
                        example: 100
                      status:
                        type: string
                        example: PROCESSED
                  inventory_restoration:
                    type: object
                    properties:
                      status:
                        type: string
                        example: RESTORED
                      vehicle_id:
                        type: string
                        example: auto-spark-01
                      new_state:
                        type: string
                        example: DISPONIBLE
                  message:
                    type: string
                    example: Orden de renta cancelada exitosamente. Vehículo liberado
                      y reembolso procesado.
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '401': *id001
        '403': *id002
        '500': *id004
        '409': *id009
  /autos/{id}/devolucion:
    post:
      tags:
      - Autos - Mantenimiento y Auditoría v2
      summary: Registrar devolución directa del vehículo e iniciar Cooldown de Limpieza
        de 2 Horas
      description: 'Cambia el estado operativo a ''EN_LIMPIEZA'' y fija el timestamp
        ''disponible_desde = NOW() + 2 HORAS''.

        Durante este lapso de 120 minutos, el auto es invisible para los motores de
        búsqueda y la API REST pública.

        '
      parameters:
      - *id006
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: auto-spark-01
      - *id003
      responses:
        '200':
          description: Devolución procesada y cooldown de 2 horas iniciado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevolucionAutoResponseV2'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '401': *id001
        '403': *id002
        '500': *id004
        '400': *id007
        '409': *id008
  /autos/{id}/mantenimiento/registro:
    post:
      tags:
      - Autos - Mantenimiento y Auditoría v2
      summary: Registro de odómetro, revisión física y alerta preventiva (Rol Técnico
        MANTENIMIENTO / ADMIN)
      description: 'Endpoint protegido exclusivamente para los roles ''MANTENIMIENTO''
        o ''ADMIN'' (RBAC Cátedra RDA2 §5).

        Registra odómetro actual, combustible, estado de neumáticos y condiciones
        de carrocería.

        Evalúa si ''kilometraje_actual >= proximo_mantenimiento_km'' para activar
        alertas operativas en el dashboard y emitir el evento CloudEvent ''auto.mantenimiento.alerta''.

        '
      parameters:
      - *id006
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: auto-spark-01
      - *id003
      - $ref: '#/components/parameters/XRoleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroMantenimientoRequestV2'
      responses:
        '200':
          description: Registro de mantenimiento asentado exitosamente y odómetro
            actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroMantenimientoResponseV2'
        '401': *id001
        '403': *id002
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500': *id004
