    ProblemDetails:
      type: object
      description: Estructura canónica de error conforme a la especificación RFC 7807
        (Problem Details for HTTP APIs).
      required:
      - type
      - title
      - status
      - detail
      properties:
        type:
          type: string
          format: uri
          description: URI absoluta o relativa que tipifica el error según la cátedra.
          example: https://booking.epn.edu.ec/errors/cooldown-activo
        title:
          type: string
          description: Resumen corto y legible del problema.
          example: Vehículo en Cooldown de Limpieza Obligatorio (2 Horas)
        status:
          type: integer
          description: Código de estado HTTP correspondiente (400, 401, 403, 404,
            409, 422, 500, 503).
          example: 409
        detail:
          type: string
          description: Explicación detallada del motivo del fallo o contingencia.
          example: El vehículo auto-spark-01 se encuentra en fase de limpieza y desinfección
            obligatoria de 120 minutos tras su retorno. Estará disponible nuevamente
            a las 14:30:00 UTC.
        instance:
          type: string
          description: URI de la solicitud que originó el error.
          example: /api/v2/autos/orders/create
        code:
          type: string
          description: Código nemotécnico unívoco para evaluación algorítmica en el
            cliente o agregador.
          example: VEHICLE_IN_CLEANING_COOLDOWN
        correlation_id:
          type: string
          description: Identificador de correlación unívoco propagado para trazabilidad
            en logs físicos.
          example: cid-aut-9921b
        timestamp:
          type: string
          format: date-time
          description: Marca de tiempo ISO 8601 UTC en que se generó la excepción.
          example: '2026-10-24T18:30:00Z'
        invalid_params:
          type: array
          description: Lista de parámetros o campos que no superaron la validación
            sintáctica o de negocio.
          items:
            type: object
            properties:
              name:
                type: string
                example: pickup_date
              reason:
                type: string
                example: La fecha de recogida no puede ser en el pasado.
    CooldownStatusDto:
      type: object
      description: Información del temporizador de enfriamiento obligatorio de 2 horas
        (120 minutos) tras retorno del vehículo (Cátedra RDA2 §5).
      properties:
        cooldown_horas:
          type: integer
          example: 2
        cooldown_minutos:
          type: integer
          example: 120
        activo:
          type: boolean
          example: true
        inicio_cooldown:
          type: string
          format: date-time
          example: '2026-10-24T12:00:00Z'
        fin_cooldown:
          type: string
          format: date-time
          example: '2026-10-24T14:00:00Z'
        proximo_estado:
          type: string
          example: DISPONIBLE
  responses:
    ProblemDetails400:
      description: Solicitud incorrecta o parámetros de fecha/edad inválidos (RFC
        7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails401:
      description: No autenticado o credenciales JWT/API-Key ausentes o inválidas
        (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails403:
      description: Acceso restringido por rol insuficiente (requiere MANTENIMIENTO
        o ADMIN) (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails404:
      description: Vehículo o reserva de auto no encontrada en la flota (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails409:
      description: Conflicto de Idempotencia o vehículo en cooldown de limpieza de
        2 horas (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails422:
      description: Error de entidad no procesable o conductor menor de 18 años (RFC
        7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails500:
      description: Error interno del servidor en telemetría de flota (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails503:
      description: Agencia de alquiler externa no disponible (Circuit Breaker abierto)
        (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT emitido conforme al estándar RFC 7519 para autenticación
        de usuarios y roles autorizados (CLIENTE, ADMIN, MANTENIMIENTO).
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Clave de API precompartida para comunicación máquina a máquina
        (M2M) e interconexión segura entre Booking Prototipo y concesionarias de Renta
        de Autos.
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Identificador único universal (UUID v4) generado por el cliente
        para garantizar idempotencia en la mutación transaccional (IETF Draft). Evita
        duplicación de cobros o bloqueo indebido de vehículos ante reintentos de red.
      schema:
        type: string
        format: uuid
      example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
    XCorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador unívoco de trazabilidad distribuida cross-broker
        (Semana 8 & Consideraciones RDA2). Se propaga entre peticiones HTTP, logs
        físicos estructurados y eventos de RabbitMQ / Apache Kafka.
      schema:
        type: string
      example: cid-aut-9921b
    XNodeIdHeader:
      name: X-Node-Id
      in: header
      required: false
      description: Identificador del nodo emisor de la petición (ej. node-booking-core-01).
      schema:
        type: string
      example: node-booking-core-01
    XRoleHeader:
      name: X-Role
      in: header
      required: false
      description: 'Rol del usuario para control de acceso basado en roles (RBAC RDA2
        §5). Valores admitidos: CLIENTE, ADMIN, MANTENIMIENTO.'
      schema:
        type: string
        enum:
        - CLIENTE
        - ADMIN
        - MANTENIMIENTO
      example: MANTENIMIENTO
security:
- BearerAuth: []
- ApiKeyAuth: []
